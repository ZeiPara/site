<!DOCTYPE html>
<html>
  <head>
    <title>インデント削除</title>
  </head>
  <body>
    <textarea id="input"></textarea><br>
    <button type="button" onclick="Clicked()">実行</button><br>
    <div id="output"></div>
    <script>
      function Clicked() {
        var input = document.getElementById("input").value;
        const result = input.replace(/^[ \t]+/gm, '').trim();
        document.getElementById("output").innerHTML = "<code><pre id=\"outputtext\">" + result + "</pre></code><br><button type=\"button\" onclick=\"Copy()\">コピー</button>";
      }
      async function Copy() {
        var text = document.getElementById("outputtext").textContent;
        try {
          await navigator.clipboard.writeText(text);
          alert('コピーしました');
        } catch (err) {
          console.error('コピーに失敗しました:', err);
        }
      }
    </script>
  </body>
</html>
