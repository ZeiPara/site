<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unicode 一覧表 (20文字ごとに改行 / 1ページ10,000文字)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .unicode-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      border: 1px solid #e5e7eb;
      transition: all 0.15s ease;
      background-color: #ffffff;
      user-select: none;
      cursor: pointer;
    }
    .dark .unicode-cell {
      border-color: #374151;
      background-color: #1f2937;
      color: #f3f4f6;
    }
    .unicode-cell:hover {
      background-color: #3b82f6;
      color: #ffffff !important;
      transform: scale(1.1);
      z-index: 10;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      border-radius: 0.25rem;
    }
    .grid-20 {
      display: grid;
      grid-template-columns: 80px repeat(20, minmax(0, 1fr));
    }
    @media (max-width: 1024px) {
      .grid-20 {
        grid-template-columns: 60px repeat(20, minmax(0, 1fr));
      }
      .unicode-cell {
        font-size: 0.875rem;
      }
    }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

  <!-- ヘッダー -->
  <header class="bg-white dark:bg-gray-800 shadow-md sticky top-0 z-30 transition-colors duration-200">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-font text-blue-600 dark:text-blue-400 text-2xl"></i>
        <h1 class="text-xl font-bold">Unicode Explorer (20文字/行)</h1>
      </div>
      
      <div class="flex items-center space-x-3 flex-wrap gap-y-2">
        <!-- 検索バー -->
        <div class="relative">
          <input type="text" id="searchInput" placeholder="文字 または 16進数 (例: U+4E00, あ)" 
                 class="pl-9 pr-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-sm bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 w-64">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-sm"></i>
        </div>

        <!-- ダークモード切り替え -->
        <button id="themeToggle" class="p-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-600 transition">
          <i class="fa-solid fa-moon dark:hidden"></i>
          <i class="fa-solid fa-sun hidden dark:inline"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 flex flex-col">
    <!-- プリセットジャンパー -->
    <div class="mb-6 flex flex-wrap items-center gap-2 bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
      <span class="text-sm font-medium text-gray-500 dark:text-gray-400 mr-2"><i class="fa-solid fa-bolt mr-1"></i>素早く移動:</span>
      <button onclick="jumpTo(0x0000)" class="px-3 py-1 bg-gray-100 dark:bg-gray-700 hover:bg-blue-100 dark:hover:bg-blue-900 text-xs font-semibold rounded-md transition">ASCII (U+0000)</button>
      <button onclick="jumpTo(0x3040)" class="px-3 py-1 bg-gray-100 dark:bg-gray-700 hover:bg-blue-100 dark:hover:bg-blue-900 text-xs font-semibold rounded-md transition">ひらがな (U+3040)</button>
      <button onclick="jumpTo(0x30A0)" class="px-3 py-1 bg-gray-100 dark:bg-gray-700 hover:bg-blue-100 dark:hover:bg-blue-900 text-xs font-semibold rounded-md transition">カタカナ (U+30A0)</button>
      <button onclick="jumpTo(0x4E00)" class="px-3 py-1 bg-gray-100 dark:bg-gray-700 hover:bg-blue-100 dark:hover:bg-blue-900 text-xs font-semibold rounded-md transition">CJK統合漢字 (U+4E00)</button>
      <button onclick="jumpTo(0x1F600)" class="px-3 py-1 bg-gray-100 dark:bg-gray-700 hover:bg-blue-100 dark:hover:bg-blue-900 text-xs font-semibold rounded-md transition">絵文字 (U+1F600)</button>
    </div>

    <!-- ページネーション & ステータス -->
    <div class="flex flex-wrap items-center justify-between gap-4 mb-4 bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700">
      <div id="statusInfo" class="text-sm font-medium text-gray-600 dark:text-gray-300">
        表示中: <span id="rangeStart" class="font-mono text-blue-600 dark:text-blue-400">U+000000</span> - <span id="rangeEnd" class="font-mono text-blue-600 dark:text-blue-400">U+00270F</span> (全 154,998+ 文字中 10,000 文字表示)
      </div>
      
      <div class="flex items-center space-x-2">
        <button id="prevBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold disabled:opacity-50 disabled:cursor-not-allowed transition flex items-center gap-1">
          <i class="fa-solid fa-chevron-left"></i> 前の10,000文字
        </button>
        <span id="pageIndicator" class="text-sm font-mono font-semibold px-2">1 / 17</span>
        <button id="nextBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold disabled:opacity-50 disabled:cursor-not-allowed transition flex items-center gap-1">
          次の10,000文字 <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>
    </div>

    <!-- テーブルコンテナ -->
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-x-auto p-4 mb-6">
      <!-- 20カラムヘッダー (+0 〜 +19) -->
      <div class="grid-20 border-b border-gray-300 dark:border-gray-600 pb-2 mb-2 text-center text-xs font-mono font-bold text-gray-500 dark:text-gray-400">
        <div>コード</div>
        <div>+0</div><div>+1</div><div>+2</div><div>+3</div><div>+4</div>
        <div>+5</div><div>+6</div><div>+7</div><div>+8</div><div>+9</div>
        <div>+10</div><div>+11</div><div>+12</div><div>+13</div><div>+14</div>
        <div>+15</div><div>+16</div><div>+17</div><div>+18</div><div>+19</div>
      </div>

      <!-- 文字グリッド本体 -->
      <div id="gridBody" class="font-mono"></div>
    </div>
  </main>

  <!-- 詳細モーダル -->
  <div id="modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl max-w-md w-full p-6 border border-gray-200 dark:border-gray-700 transform transition-all">
      <div class="flex justify-between items-start mb-4">
        <h3 class="text-lg font-bold text-gray-900 dark:text-white">Unicode 詳細情報</h3>
        <button id="closeModal" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <div class="flex flex-col items-center justify-center my-6 py-6 bg-gray-50 dark:bg-gray-900 rounded-xl border border-gray-100 dark:border-gray-700">
        <span id="modalChar" class="text-6xl mb-2 font-serif"></span>
        <span id="modalCode" class="text-sm font-mono text-blue-600 dark:text-blue-400 font-bold"></span>
      </div>

      <div class="space-y-3 text-sm">
        <div class="flex justify-between py-2 border-b border-gray-100 dark:border-gray-700">
          <span class="text-gray-500 dark:text-gray-400">10進数コード:</span>
          <span id="modalDec" class="font-mono font-semibold"></span>
        </div>
        <div class="flex justify-between py-2 border-b border-gray-100 dark:border-gray-700">
          <span class="text-gray-500 dark:text-gray-400">HTML実体参照:</span>
          <span id="modalHtml" class="font-mono font-semibold"></span>
        </div>
        <div class="flex justify-between py-2 border-b border-gray-100 dark:border-gray-700">
          <span class="text-gray-500 dark:text-gray-400">UTF-8:</span>
          <span id="modalUtf8" class="font-mono font-semibold"></span>
        </div>
        <div class="flex justify-between py-2">
          <span class="text-gray-500 dark:text-gray-400">UTF-16:</span>
          <span id="modalUtf16" class="font-mono font-semibold"></span>
        </div>
      </div>

      <button id="copyBtn" class="mt-6 w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition flex items-center justify-center gap-2">
        <i class="fa-regular fa-copy"></i> 文字をコピー
      </button>
    </div>
  </div>

  <script>
    const MAX_CODEPOINT = 0x10FFFF;
    const PAGE_SIZE = 10000; // 1ページあたり10,000文字 (500行 × 20列)
    const COLUMNS = 20;

    let currentPage = 0;
    const totalPages = Math.ceil((MAX_CODEPOINT + 1) / PAGE_SIZE);

    const gridBody = document.getElementById('gridBody');
    const rangeStart = document.getElementById('rangeStart');
    const rangeEnd = document.getElementById('rangeEnd');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageIndicator = document.getElementById('pageIndicator');
    const searchInput = document.getElementById('searchInput');

    // モーダル要素
    const modal = document.getElementById('modal');
    const closeModal = document.getElementById('closeModal');
    const modalChar = document.getElementById('modalChar');
    const modalCode = document.getElementById('modalCode');
    const modalDec = document.getElementById('modalDec');
    const modalHtml = document.getElementById('modalHtml');
    const modalUtf8 = document.getElementById('modalUtf8');
    modalUtf16 = document.getElementById('modalUtf16');
    const copyBtn = document.getElementById('copyBtn');

    let selectedChar = '';

    // ダークモード切替
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
    });

    // Unicodeの文字描画関数（パフォーマンス最適化）
    function renderPage(page) {
      currentPage = page;
      const startCode = page * PAGE_SIZE;
      const endCode = Math.min(startCode + PAGE_SIZE - 1, MAX_CODEPOINT);

      rangeStart.textContent = `U+${startCode.toString(16).toUpperCase().padStart(6, '0')}`;
      rangeEnd.textContent = `U+${endCode.toString(16).toUpperCase().padStart(6, '0')}`;
      pageIndicator.textContent = `${currentPage + 1} / ${totalPages}`;

      prevBtn.disabled = currentPage === 0;
      nextBtn.disabled = currentPage >= totalPages - 1;

      let htmlBuffer = '';

      for (let i = startCode; i <= endCode; i += COLUMNS) {
        const rowHeader = `U+${i.toString(16).toUpperCase().padStart(5, '0')}x`;
        htmlBuffer += `<div class="grid-20 items-center border-b border-gray-100 dark:border-gray-800">`;
        htmlBuffer += `<div class="text-[10px] sm:text-xs font-mono font-bold text-gray-400 text-center py-1">${rowHeader}</div>`;

        for (let j = 0; j < COLUMNS; j++) {
          const cp = i + j;
          if (cp > endCode) {
            htmlBuffer += `<div class="unicode-cell text-gray-200 dark:text-gray-700 cursor-default"></div>`;
            continue;
          }

          // 制御文字やサロゲートペア等の特別処理
          let displayChar = '';
          let isControl = false;

          if ((cp >= 0xD800 && cp <= 0xDFFF)) {
            // サロゲート領域
            isControl = true;
          } else if (cp < 32 || (cp >= 127 && cp < 160)) {
            // 制御文字
            isControl = true;
          } else {
            try {
              displayChar = String.fromCodePoint(cp);
            } catch (e) {
              isControl = true;
            }
          }

          if (isControl) {
            htmlBuffer += `<div class="unicode-cell text-[10px] text-gray-300 dark:text-gray-600 bg-gray-50 dark:bg-gray-800/50" data-cp="${cp}" onclick="openModal(${cp})">･</div>`;
          } else {
            htmlBuffer += `<div class="unicode-cell" data-cp="${cp}" onclick="openModal(${cp})">${displayChar}</div>`;
          }
        }
        htmlBuffer += `</div>`;
      }

      gridBody.innerHTML = htmlBuffer;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function jumpTo(codePoint) {
      if (codePoint < 0) codePoint = 0;
      if (codePoint > MAX_CODEPOINT) codePoint = MAX_CODEPOINT;
      const targetPage = Math.floor(codePoint / PAGE_SIZE);
      renderPage(targetPage);
    }

    // 検索処理
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const query = searchInput.value.trim();
        if (!query) return;

        let cp = null;
        if (query.toUpperCase().startsWith('U+')) {
          cp = parseInt(query.substring(2), 16);
        } else if (query.startsWith('0x')) {
          cp = parseInt(query.substring(2), 16);
        } else if (/^[0-9A-Fa-f]+$/.test(query) && query.length >= 4) {
          cp = parseInt(query, 16);
        } else {
          cp = query.codePointAt(0);
        }

        if (cp !== null && !isNaN(cp) && cp >= 0 && cp <= MAX_CODEPOINT) {
          jumpTo(cp);
        } else {
          alert('有効なUnicodeコードポイントまたは文字を入力してください。');
        }
      }
    });

    // モーダル表示
    window.openModal = function(cp) {
      const hex = cp.toString(16).toUpperCase().padStart(4, '0');
      let char = '';
      try {
        char = String.fromCodePoint(cp);
      } catch (e) {
        char = '';
      }

      selectedChar = char;
      modalChar.textContent = char;
      modalCode.textContent = `U+${hex}`;
      modalDec.textContent = cp.toLocaleString();
      modalHtml.textContent = `&#${cp}; (&#x${hex};)`;

      // UTF-8 & UTF-16 バイト計算
      try {
        const encoder = new TextEncoder();
        const utf8Bytes = Array.from(encoder.encode(char)).map(b => '0x' + b.toString(16).toUpperCase().padStart(2, '0')).join(' ');
        modalUtf8.textContent = utf8Bytes || 'N/A';
      } catch {
        modalUtf8.textContent = 'N/A';
      }

      const utf16Units = [];
      for (let i = 0; i < char.length; i++) {
        utf16Units.push('0x' + char.charCodeAt(i).toString(16).toUpperCase().padStart(4, '0'));
      }
      modalUtf16.textContent = utf16Units.join(' ') || 'N/A';

      modal.classList.remove('hidden');
    };

    closeModal.addEventListener('click', () => modal.classList.add('hidden'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.add('hidden');
    });

    copyBtn.addEventListener('click', () => {
      if (selectedChar) {
        navigator.clipboard.writeText(selectedChar);
        const originalText = copyBtn.innerHTML;
        copyBtn.innerHTML = `<i class="fa-solid fa-check"></i> コピーしました！`;
        setTimeout(() => copyBtn.innerHTML = originalText, 1500);
      }
    });

    // ページ切替イベント
    prevBtn.addEventListener('click', () => {
      if (currentPage > 0) renderPage(currentPage - 1);
    });
    nextBtn.addEventListener('click', () => {
      if (currentPage < totalPages - 1) renderPage(currentPage + 1);
    });

    // 初回レンダリング
    renderPage(0);
  </script>
</body>
</html>
