<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>テスト</title>
</head>
<body>

    <h1>CC</h1>
    <button id="loadBtn">PLAY</button>

    <script>
        document.getElementById('loadBtn').addEventListener('click', async () => {
            // 1. ポップアップブロックを回避するため、クリック直後に空のウィンドウを開く
            const newWindow = window.open("about:blank", "_blank");

            if (!newWindow) {
                alert("ポップアップがブロックされました。ブラウザの設定を確認してください。");
                return;
            }

            try {
                // 2. 同じ階層にあるファイルをフェッチ
                // ※ブラウザのセキュリティ制限（CORS）のため、file://ではなくローカルサーバー環境が必要です
                const response = await fetch('./target.html');
                
                if (!response.ok) {
                    throw new Error(`ファイルの読み込みに失敗しました (ステータス: ${response.status})`);
                }

                const fileContent = await response.text();

                // 3. 新しいウィンドウのドキュメントに書き込む
                newWindow.document.open();
                newWindow.document.write(fileContent);
                newWindow.document.close();

            } catch (error) {
                console.error(error);
                newWindow.close(); // エラー時はウィンドウを閉じる
                alert("ファイルの取得に失敗しました。\n※ブラウザで直接ファイルを開いている（file://）場合、CORS制限でfetchできないため、ローカルサーバー経由で実行してください。");
            }
        });
    </script>

</body>
</html>
